# Optional: requires Metrics Server and validated resource sizing.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: durga-website
  namespace: durga-website
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: durga-website
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70